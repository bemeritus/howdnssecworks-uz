# Bosh sahifa
home:
  title: "DNSSEC qanday ishlaydi"
  sub_title: "DNSSEC nima? U haqida hamma narsani bilish uchun DNSimple'ning qiziqarli, rasmli komiksiga sho'ng'ing!"
  seo_title: "DNSSEC tushuntirildi: DNSimple'dan qiziqarli, rasmli komiks"
  description: "DNSimple'ning maroqli komiksi bilan DNSSEC asoslariga sho'ng'ing! DNS qanday ishlashini o'rganing, xavfsizlik nega muhimligini bilib oling va texnik mavzuning yengil talqinidan bahra oling."
  big_cta: "O'qishni boshlang"
  p1: "DNSSEC qanday ishlashini sizga tako tushuntirib berishiga qanday qaraysiz? Ba'zan biror mavzuni tushunishga qiynalganingizda, uni butunlay boshqa narsa bilan aralashtirib yuborish uni anglashga yordam berishi mumkin."
  p2: "Biz bu komiksni qiziqarli qo'shimcha loyiha sifatida yaratdik. Biz kun bo'yi DNS, SSL sertifikatlari va DNSSEC bilan ishlaymiz, shuning uchun bilganlarimizni bo'lishmoqchimiz. Umid qilamizki, sizga yoqadi!"
  small_cta: "Qani boshladik"

about:
  title: "DNSSEC Komiksimiz haqida: DNSimple'ning sahna ortiga g'ayrioddiy nazar"
  description: "DNSSEC, takolar va bir chimdim o'smirona injiqlik komiksimizda qanday birlashishini bilib oling. DNSimple jamoasi bilan tanishing, DNSSEC nega muhimligini o'rganing va xavfsiz domenlarning qiziqarli talqinidan zavqlaning."
  s1: "DNSSEC komiksimizning 'Biz haqimizda' sahifasiga xush kelibsiz. Bu yerda hashamatli fon gradienti yo'qligini payqagandirsiz, ammo bularning bari o'ziga xos joziba. Biz hamma narsani soddaligicha qoldirishni yoqtiramiz (va vaqti-vaqti bilan qiziq bo'lsin deb bir oz o'smirona injiqlik ham qo'shib qo'yamiz)."
  s2: "Nega aynan bu komiks?"
  s3: "Chunki DNSSEC juda muhim narsa. U murakkab, ammo zerikarli bo'lishi shart emas. Biz uni imkon qadar qiziqarli tarzda — g'ayrioddiy hazillar (biz tarafkash emasmiz, albatta), takolar va oddiy, quruq taqdimotlarga sog'lom befarqlik bilan — sirdan xoli qilmoqchimiz."
  s4: "Buning ortida kim turibdi?"
  s5: "Bu loyiha DNSimple'dagi zo'r odamlardan chiqqan. Biz domenlarni sotamiz va ularning uzluksiz ishlashini ta'minlaymiz. Bizni ishning ko'zini biladigan odamlar tomonidan yaratilgan DNS deb tasavvur qiling. Biz 2010-yildan beri 100% masofaviy jamoamiz, Yevropa, Osiyo va Amerika bo'ylab tarqalganmiz, ammo takolarga… va DNSSEC'ga bo'lgan muhabbatimizda mukammal hamohangmiz."
  s6: "Yana nima qilamiz?"
  s7: "Biz SSL sertifikatlari va mustahkam API taklif qilamiz (bu bizning so'zimiz emas, qasam ichamiz!). Shu tariqa bir qo'lda tako, ikkinchisida klaviatura bilan domenlaringizni avtomatlashtirishingiz va boshqarishingiz mumkin. Nega qimmatli tako vaqtini DNSSEC bilan ovora bo'lib behuda sarflash kerak?"
  s8: "Xullas…"
  s9: "Tashrifingiz uchun rahmat! Komiksdan bahra oling, ozgina o'rganing, ko'p kuling va ketishdan oldin albatta bir necha tortilya olib keting. Salsa tayyormi?"

translate:
  title: "'DNSSEC qanday ishlaydi' Komiksini tarjima qiling | YAML qo'llanma va topshirish"
  description: "Inglizcha YAML shablonini yuklab oling, komiks matnini tarjima qiling va o'z versiyangizni to'liq mualliflik ko'rsatilgan holda howdnssec.works'da chop etish uchun qanday topshirishni o'rganing."

# Epizodlar
ep1:
  title: "DNSSEC 101: nega bizga DNSSEC kerak?"
  description: "DNSSEC DNS javoblarini tekshirish orqali soxtalashtirishning oldini olishga qanday yordam berishini bilib oling. U xavfsiz veb-navigatsiya uchun nega muhimligini o'rganing, shuningdek rezolverlar va avtoritativ serverlar bo'yicha bilimlaringizni yangilang."
  s1: "Yaxshi savol! Nega bizga DNSSEC kerak?"
  s2: "DNS Internet hali juda kichkina bo'lganida yaratilgan."
  s3: "Xavfsizlik uning dizaynida asosiy tashvish emas edi."
  s4: "Oddiy qilib aytganda, DNS'ning asosiy vazifasi inson uchun qulay nomlarni noutbukingiz, telefonlaringiz va boshqa tarmoq qurilmalaringizga kerak bo'ladigan IP manzillarga o'girishdir."
  s5: "DNS xuddi katta telefon kitobiga o'xshaydi — qurilmalaringiz undan sizga veb-saytni yetkazish yoki elektron xatlaringizni jo'natish uchun foydalanadi."
  s6: "**DNS rezolverlari** siz uchun bu ma'lumotni topib beradiganlardir."
  s7: "Va bu ma'lumot ko'pincha **avtoritativ serverlar** tomonidan taqdim etiladi."
  s8: "Ammo DNS rezolverlarida avtoritativ serverdan kelgan javobning haqiqiyligini tekshirishning imkoni yo'q."
  s9: "Agar javob soxtalashtirilgan bo'lsa-chi?"
  s10: "Aynan shu yerda **DNSSEC** ishga tushadi."
  s11: "Rezolverlar? Avtoritativ nom serverlari? Bularning bari nima o'zi? Bilimlaringizni yangilash uchun <a href='https://howdns.works' target='_blank'>**HowDNS.works**</a> saytiga kiring va shu yerga qayting."
  s12: "Men kutib turaman."
  s13: "DNSSEC — bu Domain Name System Security Extensions (Domen Nomlari Tizimi Xavfsizlik Kengaytmalari)ning qisqartmasi."
  s14: "HTTPS singari, DNSSEC ham DNS ustida autentifikatsiyalangan javoblarga ruxsat berib, qo'shimcha xavfsizlik qatlamini ta'minlaydi."
  s15: "Biroq, muhim bir farq bor."
  s16: "HTTPS trafikni shifrlaydi, shunda hech bir qisqichbaqa ma'lumotlaringizni poylay olmaydi."
  s17: "**DNSSEC DNS ma'lumotlarini imzolaydi**, shunda hech bir qisqichbaqa DNS javoblaringizga tegmaganini aniqlash mumkin bo'ladi."
  s18: "Yomon qisqichbaqa. Yomon."
  s19: "DNSSEC HTTPS kabi to'liq shifrlashni o'z ichiga olmaydi."
  s20: "Ma'lumot rezolver bilan avtoritativ server o'rtasida maxfiy va yashirin saqlanmaydi."
  s21: "Keling, DNSSEC'ga sal chuqurroq sho'ng'iymiz. Tayyormisiz?"

ep2:
  title: "DNSSEC asoslari: RRset, RRSIG va DNSKEY qanday birgalikda ishlaydi"
  description: "DNSSEC RRset'lar, zona imzolash kalitlari va resurs yozuvlari imzolari yordamida DNS ma'lumotlarini qanday himoya qilishini o'rganing. Maxfiy/ochiq kalit juftlari, xeshlash va rezolverlar haqiqiylikni qanday tekshirishi haqida bilib oling."
  s1: "DNS ma'lumotlarining haqiqiyligini tasdiqlash uchun DNSSEC bir nechta yangi DNS yozuv turlarini joriy qiladi."
  s2: "Domeningizni DNSSEC bilan sozlaganingizda, DNS provayderingiz qiladigan birinchi ish — barcha yozuvlarni **RRset**'larga to'plashdir."
  s3: "RRset'dagi RR — bu resurs yozuvlari (resource records) degani. Bu zona yoki domen uchun 'bir xil tur va nomdagi yozuvlar' deyishning chiroyliroq usuli."
  s4: "RRset'lar bir xil tur va nomdagi barcha yozuvlarni raqamli imzolanadigan bitta guruhga to'playdi."
  s5: "Real dunyoda odamlar xabarning kimligi va haqiqiyligini bog'lash uchun imzolardan foydalanadilar."
  s6: "Xuddi shu o'xshatishni DNSSEC dunyosida ham qo'llash mumkin."
  s7: "Avtoritativ server har bir RRset'ni **zona imzolash kaliti juftligi** bilan imzolaydi."
  s8: "Kalitlar haqida keyinroq ko'proq gaplashamiz, shuning uchun eslab qoling: bu kalitlar zona yozuvlaridagi imzoni yaratish va tekshirish uchun ishlatiladi."
  s9: "Har bir zona imzolash kaliti **maxfiy** va **ochiq** kalit juftligiga ega. Bu asimmetrik kriptografiyaning asosidir."
  s10: "Maxfiy va ochiq kalitlar birgalikda ishlaydi. Maxfiy kalit bilan shifrlangan ma'lumotni ochiq kalit bilan shifrini ochish yoki tasdiqlash mumkin."
  s11: "Ochiq kalitni istalgan odam bilan bo'lishish mumkin. U ochiq va hamma uchun mavjud."
  s12-1: "Maxfiy kalitlar esa &mdash; siz to'g'ri topdingiz, maxfiy va ular bilan bo'lishilmasligi kerak."
  s12-2: "Ularni qisqichbaqalar qo'liga tushirmang!"
  s13: "Bu ikki kalit birgalikda ikkita muhim xususiyatni ta'minlaydi!"
  s14-1: "**Bir**: Kontent to'g'ri manbadan kelayotganini tasdiqlash."
  s14-2: "**Ikki**: Kontent jo'natilganidan beri o'zgartirilmaganini tasdiqlash."
  s15: "Bu kalitlar yozuvlarning butun kontentini shifrlash uchun ishlatilmaydi. Buning o'rniga, RRset'ning bir qismini olib, uni xeshlash va shifrlash orqali raqamli imzo yaratiladi."
  s16-1: "Xeshlash jarayoni faqat tasdiqlash maqsadida emas."
  s16-2: "Xeshlash jo'natiladigan kontentning hajmini kamaytiradi va imzoni sobit uzunlikka keltiradi."
  s17: "Bu muhim, chunki biz DNS protokolini kichik va yengil saqlashni xohlaymiz."
  s18: "Imzolar **RRSIG** (Resource Record Signature — Resurs Yozuvi Imzosi) deb ataladigan DNS yozuvida saqlanadi."
  s19: "O'sha RRSIG yozuvining shifrini ochadigan ochiq kalit esa **DNSKEY** deb ataladigan yangi DNS yozuv turida saqlanadi."
  s20: "Mana bu qanday sodir bo'ladi..."
  s21: "RRset'dagi ba'zi kontent xeshlash algoritmi orqali xeshlanadi."
  s22: "Natija zona imzolash kalitining maxfiy qismi bilan shifrlanadi va RRSIG yozuvi yaratiladi."
  s23: "So'ngra avtoritativ server RRset va RRSIG'ni rezolverga jo'natadi."
  s24: "Rezolver RRset'ni oladi va xuddi avtoritativ server qilganidek, o'sha algoritm bilan uni qaytadan xeshlaydi."
  s25: "Rezolver imzo yozuvining shifrini zona imzolash kalitining ochiq qismi bilan ochib, uni xeshga aylantiradi."
  s26: "Agar ikkala xesh mos kelsa, rezolver javob kutilgan manbadan kelayotganini va soxtalashtirilmaganini biladi."
  s27: "DNSSEC'ni qo'llab-quvvatlamaydigan yoki xeshlash bosqichlarini qo'llab-quvvatlaydigan algoritmga ega bo'lmagan rezolver yozuv bilan qaytgan imzoni e'tiborsiz qoldiradi."
  s28: "DNS rezolveri www.dnsimple.com uchun A yozuvini so'raganda joriy oqim mana bunday bo'ladi."
  s29: "Avtoritativ server A yozuvini ham RRset, ham RRSIG yozuvi ko'rinishida qaytaradi."
  s30: "So'ngra rezolver so'ralgan yozuv haqiqiy va ishonchli manbadan kelayotganini tasdiqlash uchun DNSKEY yozuvini so'raydi."
  s31: "Rezolver javobni RRset, RRSIG va DNSKEY orqali tasdiqlaydi."
  s32: "Ammo DNSKEY buzib kirilgan bo'lsa-chi?"

ep3:
  title: "DNSSEC Kalit Imzolash Kalitlari: Ishonch zanjirini kengaytirish"
  description: "Kalit imzolash kalitlari DNSKEY yozuvlarini qanday tasdiqlashi va DNSSEC ishonch zanjirini qanday mustahkamlashini o'rganing. Ierarxik zona munosabatlari, RRSIG'lar va rezolverlar ota-bola domenlarda haqiqiylikni qanday tasdiqlashini o'rganing."
  s1: "**Kalit imzolash kalitlari** DNSKEY'ga ishonish mumkinligini ta'minlash uchun mavjud."
  s2: "Kalit imzolash kalitlari DNSKEY yozuvini xuddi zona imzolash kalitlari RRset'larni himoya qilgani kabi tasdiqlaydi."
  s3: "Hozirgacha bizda quyidagilar bor:"
  s4: "Yozuvlar RRset'larga to'planadi va zona imzolash kalitlari bilan imzolanadi. O'sha kalitning ochiq qismi DNSKEY yozuvida saqlanadi."
  s5: "Endi o'sha DNSKEY yozuvi kalit imzolash kaliti bilan imzolanadi va qo'shimcha RRSIG yozuvi yaratiladi."
  s6: "Kalit imzolash kalitining ochiq qismi boshqa bir DNSKEY yozuvida saqlanadi."
  s7: "2 ta DNSKEY yozuvi kalit imzolash kalitining maxfiy kaliti bilan imzolanadigan RRset'ga to'planadi."
  s8: "Endi DNS rezolveri DNSKEY'ni so'raganda, u DNSKEY yozuvlaridan iborat RRset'ni RRSIG bilan birga oladi."
  s9: "Endi jarayon quyidagicha kechadi..."
  s10-1: "Rezolver avtoritativ nom serveridan www.dnsimple.com uchun A yozuvlarini so'raydi."
  s10-2: "www.dnsimple.com A yozuvini bering-chi?"
  s11: "Avtoritativ server A yozuvlarini o'z ichiga olgan RRset'ni zona imzolash kalitining imzosini o'z ichiga olgan RRSIG bilan birga qaytaradi."
  s12-1: "Rezolver RRSIG yozuvidagi imzoni tasdiqlash uchun avtoritativ serverdan DNSKEY'ni yana so'raydi."
  s12-2: "DNSKEY'ni bering-chi?"
  s13: "Avtoritativ server zona imzolash va kalit imzolash kalitlari uchun DNSKEY'ni o'z ichiga olgan RRset'ni RRSIG yozuvi bilan birga qaytaradi."
  s14: "Endi rezolverda DNS so'rovini tasdiqlash uchun barcha ma'lumot mavjud."
  s15: "U RRset'dagi A yozuvlari uchun RRSIG'ni zona imzolash kaliti yaratgan DNSKEY bilan tekshiradi."
  s16: "Agar bu haqiqiy bo'lsa, u DNSKEY RRset'i uchun RRSIG'ni kalit imzolash kaliti yaratgan DNSKEY bilan tekshiradi."
  s17: "Bularning bari bajarilgach, rezolver avtoritativ server qaytargan A yozuvlari qiymatlariga ishonishi mumkinligiga amin bo'ladi."
  s18: "Bularning bari ajoyib, ammo endi biz yana boshqa muammolarga duch kelmoqdamiz."
  s19: "DNS ierarxikdir. Bitta zonaga ishonish ota yoki bola zonaga ishonishimiz mumkin degani emas."
  s20: "Biz www.dnsimple.com'dagi A yozuvlariga ishonishimiz mumkinligini bilamiz, ammo ota va bolalar-chi?"
  s21: "Kalit imzolash kaliti o'zi tomonidan imzolanadi. Agar u buzib kirilgan bo'lsa-chi?"

ep4:
  title: "DNSSEC Ishonch Zanjiri: DS yozuvi ota va bola zonalarni qanday bog'laydi"
  description: "DNSSEC ota zonadan bola zonaga ishonch o'rnatish uchun DS yozuvidan qanday foydalanishini o'rganing. Rezolverlar DNSKEY'larni qanday tasdiqlashi, soxtalashtirishni qanday aniqlashi va xavfsiz DNS ierarxiyasini qanday saqlab turishini bilib oling."
  s1: "Biz DNS ierarxik ekanini aytib o'tdik."
  s2-1: "Rezolver dnsimple.com uchun A yozuvlarini so'rashi kerak bo'lganda, u avval ildizdan .com serverlarini qayerdan topishni so'rashi kerak."
  s2-2: "* HowDNS.works komiksidagi personaj"
  s3-1: "So'ngra .com serverlari rezolverni dnsimple.com uchun avtoritativ nom serverlariga yo'naltiradi."
  s3-2: "* HowDNS.works komiksidagi yana bir personaj"
  s4-1: "Nihoyat, avtoritativ server dnsimple.com uchun A yozuvlarining IP manzili bilan javob beradi."
  s4-2: "* HowDNS.works komiksidagi yana bir boshqa personaj, ammo buni siz allaqachon bilardingiz."
  s5: "Bularning bari **ishonch zanjiri**ga asoslanadi."
  s6: "Boshqa server bilan har bir bosqichda rezolver o'zi ishonchli otadan ishonchli bolaga yo'naltirilayotganiga ishonadi."
  s7: "DNSSEC dunyosida bu **delegatsiya imzolovchisi** (DS) deb ataladigan yangi yozuv turi orqali amalga oshiriladi."
  s8: "DS yozuvi bola zonada yaratiladi va ota zonaga beriladi."
  s9: "DS yozuvi DNSKEY yozuvida saqlanadigan kalit imzolash kalitining ochiq qismini o'z ichiga oladi, u DNS provayderingiz tomonidan xeshlangan bo'ladi."
  s10: "Bu DS yozuvi ota zonada mavjud bo'lishi kerak."
  s11: "DNS rezolveri bola zonani so'raganda, ota zona rezolverga DS yozuvini beradi."
  s12: "Bu 2 ta maqsadga xizmat qiladi:"
  s13: "Birinchidan, endi rezolver bola zona DNSSEC bilan sozlanganini biladi."
  s14: "Ikkinchidan, rezolver ota zonadagi shifrlanmagan DS yozuvi bola zonadagi DNSKEY'ga mos kelishini tekshirishi mumkin."
  s15: "Rezolver bolaning DNSKEY'ini qayta xeshlaydi va bu natijani DS yozuvi bilan solishtiradi."
  s16: "Agar ular mos kelmasa, rezolver zona soxtalashtirilganini biladi."
  s17: "Agar ular mos kelsa, endi rezolver dnsimple.com'ga ishonishi mumkin."
  s18: "Endi biz DNSimple'ga ishonishimiz mumkinligini bilamiz. Ammo .com va ildiz-chi?"

ep5:
  title: "Ildizdagi DNSSEC: Inson boshchiligidagi imzolash marosimlari va ishonch zanjiri"
  description: "Real dunyodagi odamlarga tayangan ildiz zonasining kalit imzolash marosimi butun DNS ierarxiyasini qanday himoya qilishini bilib oling. DS yozuvlari, KSK'lar va ZSK'lar birgalikda DNSSEC'ning uzilmas ishonch zanjirini qanday hosil qilishini o'rganing."
  s1: "DS yozuviga ishonish mumkinligini bilish uchun bola zonalardan ota zonalarga qarab ierarxiya bo'ylab sayohat qilarkanmiz, oxir-oqibat ierarxiyaning eng yuqori qismiga — kompyuterlarga ruxsat berilmagan joyga yetib boramiz."
  s2: "Ildiz zonasi DS yozuviga ega bo'lgan oxirgi otadir."
  s3: "Ildiz zonasidagi kalit imzolash kaliti yaratgan DNSKEY yozuvi o'z-o'zini tasdiqlaydi. Ammo bu yozuvga ishonchni kim o'rnatgan?"
  s4: "**ODAMLAR!**"
  s5: "Ildiz imzolash marosimi — bu odamlar yig'ilib, eng yuqori DNSKEY kalitining almashinuvini nishonlaydigan va uni imzolaydigan tadbir."
  s6: "U yiliga 4 marta o'tkaziladi."
  s7: "Bularning bari xavfsiz joyda, audit firmalarining yuqori darajadagi nazorati ostida amalga oshiriladi."
  s8: "Marosimda ishtirok etuvchi odamlar faqat bir nechta amalni bajarishi mumkin, bu esa hatto yovuz niyatli guruh bo'lsa ham, ular tadbirni buza olmasligini ta'minlaydi."
  s9: "O'sha marosimning natijasi — ildizdagi DNSKEY'ni tekshirish uchun ishlatiladigan **yangi RRSIG yozuvi**dir."
  s10: "Keling, ildizdan boshlab ishonch zanjirini birgalikda ko'rib chiqamiz."
  s11: "Siz dnsimple.com'ga o'tganingizda, DNS rezolveri ildizdan .com serverining joylashuvini so'raydi."
  s12: "DNS rezolveri ildizdagi kalit imzolash kalitining DNSKEY'iga ishonish mumkin deb hisoblaydi, chunki u odamlar tomonidan yaratilgan."
  s13: "Endi biz ildiz zonasining kalitiga ishonganimizdan so'ng (ildiz imzolash marosimidagi sirli odamlar, rahmat sizga!), biz .com'ni, so'ng dnsimple.com'ni va nihoyat www.dnsimple.com'ni tekshirishimiz mumkin."
  s14: "Agar zanjirning biror halqasi ishlamay qolsa, masalan, DS yozuvi DNSKEY'ga mos kelmasa, DNSSEC rezolverni ogohlantiradi."
  s15: "So'ngra rezolver ishonchsiz javobni qurilmangizga uzatishdan bosh tortadi."
  s16: "Bu, aslida, yovuz qisqichbaqalar, soxtalashtirilgan ma'lumotlar yoki qobiliyatsiz yovuz xakerlar uchun katta **Ruxsat Berilmadi** belgisidir."
  s17: "Xullas, qisqacha aytganda, DNSSEC shunday"
  s18: "Zona imzolash kalitlari ma'lumotni imzolaydi."
  s19: "Kalit imzolash kalitlari zona imzolash kalitlarini imzolaydi."
  s20: "Ota zonadagi DS yozuvlari bola zonaning haqiqiyligini tasdiqlaydi."
  s21: "Ildiz zonasi real dunyodagi odamlar tomonidan tasdiqlanadi, bu esa butun DNS daraxti ishonchga tayanishini ta'minlaydi."
  s22: "Endi bularning bari qanday ishlashini ko'rganingizdan so'ng, oldinga intiling va domenlaringizni DNSSEC bilan himoyalang!"
  s23: "Qancha qisqichbaqa trafikingizni soxtalashtirishga urinmasin, DNS dunyosi xavfsizroq joyga aylanadi!"
  s24: "DNSSEC ko'nikmalaringizni sinab ko'rishga tayyormisiz? Hoziroq matnli sarguzashtimizga sho'ng'ing va DNS olamidagi har bir tahdiddan aqlliroq bo'la olasizmi, ko'ring!"
  s25: "O'yinni o'ynang"

game:
  intro:
    title: "DNSSEC Sarguzashti: Matnli sarguzasht o'yini"
    description: "DNSSEC nima va u qanday ishlaydi? Raqamli olam bo'ylab hayajonli sarguzashtga tayyorlaning — bu yerda siz DNSSEC tushunchalarini interaktiv hikoya ko'rinishida o'zlashtirasiz."
    s1: "DNSSEC"
    s2: "Matnli sarguzasht o'yini"
    s3: "Sirli sarguzashtga tayyorlaning! Bitta noto'g'ri 'dig' va siz zonada adashib qolasiz! Ushbu DNSSEC matnli sarguzashtida taqdiringiz imzolangan yoki muhrlangan bo'ladi."
    s4: "O'ynash"
