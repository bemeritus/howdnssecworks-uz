  page1:
    title: "DNSSEC Sarguzashti: Rezolverning uyg'onishi"
    description: "Nomlarni raqamlarga bog'lashga tayyor qahramon Rezolver sifatida raqamli zulmatda uyg'oning. Birinchi so'rovingiz chaqirmoqda — uning chaqirig'iga quloq solasizmi?"
    s1: "Siz raqamli zulmatda uyg'onasiz — kutayotgan so'rovlarning muloyim g'ovillashidan boshqa hamma joy jimjit."
    s2: "Siz **Rezolver**siz — veb-sayt nomlarini ularning raqamli uylariga bog'laydigan raqamli qahramon. To'satdan mikrosxemalaringiz jonlanadi. Endigina so'rov keldi!"
  page2:
    title: "DNSSEC Sarguzashti: Birinchi so'rov"
    description: "Yangi so'rov keladi: www.dnsimple.com'ni hal qiling. Rezolver rolingizga kiring va DNS olami bo'ylab sayohatga chiqing."
    s1: "**www.dnsimple.com**'ni hal qiling."
  page3:
    title: "DNSSEC Sarguzashti: Ildiz zonasiga kirish"
    description: "Protokollaringizni ishga tushiring va DNSSEC dunyosidagi eng qadimiy va eng mustahkam olam — Ildiz zonasiga sho'ng'ishga tayyorlaning."
    s1: "Ishga kirishish vaqti keldi. Ichingizda protokollar ishga tushadi."
    s2: "Javobni xavfsiz topish uchun siz noma'lum raqamli hududga jur'at qilib kirishingiz kerak bo'ladi."
    s3: "Birinchi to'xtash joyingiz — **Ildiz zonasi**, DNS olamidagi eng qadimiy va eng himoyalangan joy."
  page4:
    # Endi mavjud emas
  page5:
    title: "DNSSEC Sarguzashti: Sirli xona"
    description: "Sirli signallar, miltillovchi konsol va qulflangan Darvoza bilan to'la xira, sirli xonani o'rganing. Qaysi yo'lni tanlaysiz?"
    s1: "Siz o'zingizni sir-asrorga to'la, xira raqamli xonada ko'rasiz. Ko'zingizga tushadi:"
    s2: "G'alati signallar jo'natayotgan soyali burchak."
    s3: "Muloyim miltillayotgan shaffof konsol."
    s4: "'Qo'riqchi Darvozasi' deb belgilangan muhrlangan eshik."
    s5: "Nima qilmoqchisiz?"
    s6: "G'alati signalli burchakni ko'rib chiqish"
    s7: "Miltillayotgan konsol bilan o'ynab ko'rish"
    s8: "Qo'riqchi Darvozasini ochishga urinish"
  page6:
    title: "DNSSEC Sarguzashti: Buzilgan ma'lumot ogohlantirishi"
    description: "To'satdan sizga buzilgan ma'lumot paketlari uriladi! Signal yangraydi va mikrosxemalaringiz qotib qoladi — omon chiqa olasizmi?"
    s1: "Voy-bo', buzilgan ma'lumot paketlari! Signal yangraydi va mikrosxemalaringizni qotirib qo'yadi."
    s2: "Ulanish uzildi."
  page7:
    title: "DNSSEC Sarguzashti: Qo'riqchi Darvozasini ochish"
    description: "Muhim DNSSEC jurnallarini kashf eting va Qo'riqchi Darvozasini ochish uchun yangi bilimingizdan foydalaning. Oldinga yo'l kutmoqda!"
    s1: "Siz konsolda DNSSEC haqidagi tarixiy jurnallarni o'qiysiz &mdash; foydali ma'lumot!"
    s2: "Qo'riqchi Darvozasi sizning tayyorligingizni sezadi va o'zini o'zi ochadi."
    s3: "Darvozadan o'tish"
  page8:
    title: "DNSSEC Sarguzashti: Tayyorgarlik Darvozasi"
    description: "Qo'riqchi Darvozasi ochilishdan bosh tortadi. Sirli ovoz tayyorgarlik zarurligini ta'kidlaydi. O'zingizni namoyon qilib, oldinga siljiy olasizmi?"
    s1: "Darvoza qimir etmaydi. Muloyim ovoz shivirlaydi: 'Avval tayyorgarlik, rezolver.'"
  page9:
    title: "DNSSEC Sarguzashti: Tako ismli kutilmagan hodisa"
    description: "Qo'riqchi Darvozasidan o'tayotib, siz miltillovchi bir siymoga duch kelasiz — bu Tako ekan. Do'stona chehrami yoki navbatdagi sinovmi?"
    s1: "Qo'riqchi Darvozasidan o'tayotib, siz Qo'riqchiga — miltillovchi raqamli mavjudotga duch kelasiz."
    s2: "Voy, shoshmang, bu shunchaki Tako-ku!"
  page10:
    title: "DNSSEC Sarguzashti: Takoning haqiqiylik jumbog'i"
    description: "Takoning jumbog'iga duch keling: “DNSSEC'da men haqiqiylikni ta'minlayman; ildizdan bargacha uzilmagan zanjir.” Uni yechib, Ildiz Serveriga o'ta olasizmi?"
    s1: "'Rezolver, Ildiz Serverining xonasiga kirishdan oldin, sen mening **jumbog'im**ga javob berishing kerak,' deydi Tako tirjayib."
    s2: "DNSSEC'da men haqiqiylikni ta'minlayman; ildizdan bargacha uzilmagan zanjir. Men kimman?"
    s3: "Javobingiz qanday?"
    s4: "DNSSEC Ishonch Zanjiri"
    s5: "Zona imzolash kalitlari"
    s6: "DS yozuvlari"
    s7: "Takoning yonidan sirg'alib Ildiz Serveri xonasiga kirishga urinish"
  page11:
    title: "DNSSEC Sarguzashti: Tako Darvozasidagi g'alaba"
    description: "Tako javobingizni to'g'ri deb e'lon qiladi va Ildiz xonasiga yo'lni ochadi. DNSSEC dunyosiga chuqurroq kirib, DNS kelajagingizni himoyalang."
    s1: "**To'g'ri!** Tako quvonadi."
    s2: "Ildiz xonasiga kirish"
  page12:
    title: "DNSSEC Sarguzashti: Zona imzolash kaliti bo'yicha xato"
    description: "Tako javobingizni rad etadi va ZSK faqat zona ichidagi DNS yozuvlarini imzolashini eslatadi. Bu xatodan saboq oling — so'ng qayta urinib ko'ring."
    s1: "'Yo'q,' Tako boshini chayqaydi. 'Unchalik emas.'"
    s2: "Zona Imzolash Kaliti (ZSK) zona ichidagi har bir DNS yozuvini imzolaydi va haqiqiylikni ta'minlashga yordam beradi, ammo o'zi butun ishonch zanjiri emas."
    s3: "Ulanish uzildi."
  page13:
    title: "DNSSEC Sarguzashti: DS yozuvi hamma narsa emas"
    description: "Siz DS yozuvlari deb taxmin qildingiz, ammo Tako uf tortadi. DS ota va bola zonalarni bog'lasa-da, u baribir to'liq ishonch zanjiri emas."
    s1: "'Noto'g'ri,' Tako uf tortadi."
    s2: "DS yozuvi ota va bola zonalar o'rtasida DNSSEC ishonchini bog'laydi, ammo o'zi to'liq zanjir emas."
    s3: "Ulanish uzildi."
  page14:
    title: "DNSSEC Sarguzashti: Ruxsatsiz kirish rad etildi"
    description: "Takoning jumbog'ini chetlab o'tishga urinish qat'iy protokol bloklanishini keltirib chiqaradi. Ulanishingiz uziladi — qoidalarga rioya qiling yoki oqibatiga tayyor bo'ling."
    s1: "'Protokolni hurmat qil! Ruxsatsiz kirish bloklandi,' deb ogohlantiradi Tako."
    s2: "Ulanish uzildi."
  page15:
    title: "DNSSEC Sarguzashti: Ildiz zonasi qalbiga kirish"
    description: "Raqamli aura kuchayib borayotgan Ildiz zonasining o'zagiga chuqurroq sho'ng'ing. Dahshatli Ildiz Serveri bilan navbatdagi uchrashuvga tayyorlaning."
    s1: "Endi siz Ildiz zonasining tub qalbidasiz va atrofdagi raqamli kuchni his qilyapsiz."
    s2: "To'satdan Ildiz Serverining o'zi — ulug'vor va nufuzli — paydo bo'ladi."
  page16:
    title: "DNSSEC Sarguzashti: Ildiz Serveri so'zlaydi"
    description: "Ildiz zonasi bo'ylab ulug'vor ovoz yangraydi. Ildiz Serveri sayohatingizni tan oladi, ammo chuqurroq bilim kerakligini ogohlantiradi."
    s1: "Ildiz Serveri so'zlaydi:"
    s2: "'Rezolver, sen uzoq yo'l bosib kelding, ammo haqiqiy xavfsizlik chuqurroq bilim talab qiladi.'"
  page17:
    title: "DNSSEC Sarguzashti: Ildiz Serverining jumbog'i"
    description: "Ildiz Serverining hal qiluvchi sinoviga duch keling. Qaysi DNSSEC yozuvi shifrlangan dalil beradi va yaxlitlikni himoya qiladi?"
    s1: "U sinov o'rtaga tashlaydi:"
    s2: "DNSSEC tekshiruvida imzoyim haqiqiylikni isbotlaydi. Shifrlangan dalil beraman, yaxlitlikni ta'minlayman. Ismim nima?"
    s3: "Javobingiz?"
    s4: "NS yozuvi"
    s5: "DNSKEY yozuvi"
    s6: "RRSIG yozuvi"
    s7: "DNSSEC kalitini kuch bilan tortib olishga urinish"
  page18:
    title: "DNSSEC Sarguzashti: NS yozuvi haqida tushunmovchilik"
    description: "Ildiz Serverining jumbog'i uchun NS yozuvi deb taxmin qilish yetarli bo'lmaydi. NS nega faqat nom serverlariga ishora qilishini va hech qanday kriptografik dalil bermasligini o'rganing."
    s1: "Ildiz Serveri uf tortadi. 'Noto'g'ri, kechir.'"
    s2: "NS yozuvlari sizni shunchaki nom serverlariga yo'naltiradi, ularda imzo yo'q va ular yaxlitlikni isbotlamaydi."
    s3: "Ulanish uzildi."
  page19:
    title: "DNSSEC Sarguzashti: DNSKEY imzo emas"
    description: "DNSKEY ochiq kalitlarni saqlaydi, ammo ma'lumotni imzolamaydi. Noto'g'ri taxmin uzilishga olib keladi. Qayta urinishga tayyormisiz?"
    s1: "Ildiz Serveri boshini chayqaydi. 'Tushunmovchilik aniqlandi.'"
    s2: "DNSKEY yozuvlari ochiq kalitlarni saqlaydi, ammo o'zi imzo taqdim etmaydi."
    s3: "Ulanish uzildi."
  page20:
    title: "DNSSEC Sarguzashti: G'alaba va Ildiz Kaliti"
    description: "To'g'ri javobingiz sizga nufuzli DNSSEC Ildiz Kalitini olib beradi, bu esa kelajakdagi so'rovlarni xavfsiz tasdiqlash imkonini beradi. Oldinga, Rezolver!"
    s1: "'Barakalla,' deydi Ildiz Serveri iliqlik bilan. 'Topding!'"
    s2: "Sizga nufuzli DNSSEC Ildiz Kaliti beriladi."
    s3: "Endi siz kelajakdagi so'rovlarni xavfsiz tasdiqlashingiz mumkin."
  page21:
    title: "DNSSEC Sarguzashti: Ildizdagi xavfsizlik buzilishi"
    description: "Xavotirga tushgan Ildiz Serveri protokolni buzganingiz uchun kirishni rad etadi. Seansingiz uziladi — uning ogohlantirishiga quloq soling."
    s1: "'Xavfsizlik buzilishi aniqlandi!' deb baqiradi Ildiz Serveri. 'Ruxsat berilmadi.'"
    s2: "Ulanish uzildi."
  page22:
    title: "DNSSEC Sarguzashti: .COM'ga portal"
    description: ".COM TLD serveriga olib boradigan darvozadan o'ting. Bu raqamli olamda oldinda qanday yangi sinovlar kutmoqda?"
    s1: "Siz sizni .COM TLD serveriga olib boradigan portalga qadam qo'yasiz."
  page23:
    title: "DNSSEC Sarguzashti: Takoning navbatdagi jumbog'i"
    description: ".COM TLD'da Tako bilan qayta uchrashing. Navbatdagi bosqichga tayyorligingizni isbotlash uchun DNSSEC kalitlari haqidagi sirli jumboqqa javob bering."
    s1: "Narigi tomonda Tako sizni yana kutib oladi."
    s2: "'DNSSEC Ildiz Kalitini qo'lga kiritganing zo'r bo'ldi! Ammo .COM'ga yetishdan oldin o'rganadigan narsalar hali bor,' deb kuladi Tako."
    s3: "Takoning navbatdagi **jumbog'i**:"
    s4: "Men o'z olamimdagi har bir yozuvni qo'riqlayman, kriptografik muhrim soxtakorlarni uzoqda tutadi. Yuqoridagi og'a-inimdan martabam kichikroq, ammo DNSSEC uchun kundan-kunga zarurman. Men kimman?"
    s5: "Tako javobingizni kutadi."
    s6: "DS yozuvi"
    s7: "Zona Imzolash Kaliti (ZSK)"
    s8: "Kalit Imzolash Kaliti (KSK)"
  page24:
    title: "DNSSEC Sarguzashti: DS yozuvi yetarli emas"
    description: "Tako sizning DS taxminingizga qovog'ini soladi — bu ota-bola ishonchi uchun foydali, ammo har bir zona yozuvini imzolash uchun emas."
    s1: "'Unchalik emas,' Tako qovog'ini soladi."
    s2: "DS yozuvlari otani bolaga bog'laydi, ammo bola zona ichidagi ma'lumotni bevosita imzolamaydi. Ular jumboqda tasvirlangan narsa emas."
  page25:
    title: "DNSSEC Sarguzashti: ZSK aniqlandi"
    description: "To'g'ri javobingiz Takoni hayratda qoldiradi. .COM TLD xonasiga kiring — maqsadingizga bir qadam yaqinroq."
    s1: "'To'g'ri!' Tako mamnun bosh irg'aydi."
    s2: ".COM TLD xonasiga kirish"
  page26:
    title: "DNSSEC Sarguzashti: KSK bo'yicha xato"
    description: "Tako uf tortadi — KSK'lar alohida yozuvlarni emas, DNSKEY to'plamlarini imzolaydi. Sayohatingiz to'xtab qoladi. Qayta urinib ko'ring."
    s1: "'Yo'q, kechir,' Tako uf tortadi."
    s2: "Kalit Imzolash Kaliti (KSK) ZSK kabi har bir alohida yozuvni emas, DNSKEY yozuvlarini imzolaydi."
  page27:
    title: "DNSSEC Sarguzashti: Ulkan .COM TLD"
    description: "Delegatsiyalarga to'la ulkan .COM xonasiga yetib boring. dnsimple.com uchun DS va NS yozuvlari shundoqqina yaqin joyda."
    s1: "Siz cheksiz delegatsiyalar bilan to'la ulkan .COM TLD xonasiga yetib borasiz."
    s2: ".COM TLD'ning o'zi yuksalib, tepada paydo bo'ladi."
    s3: "Siz dnsimple.com uchun DS va NS yozuvlariga yaqin ekaningizni sezasiz, ammo oxirgi bir to'siq bor."
  page28:
    title: "DNSSEC Sarguzashti: Delegatsiya bilimini isbotlang"
    description: ".COM TLD sizni yana bir DNSSEC jumbog'i bilan sinaydi. DS yozuvlarini qanchalik yaxshi bilishingizni ko'rsating, aks holda rad etilish xavfi bor."
    s1: "'Avval DNSSEC delegatsiyasini tushunishingni isbotla,' deydi .COM TLD."
    s2: "Ushbu **jumboq**ni yeching:"
    s3: "Kriptografik ishoram har bir bolaga ishonch merosini ta'minlaydi; ota zonasiga qo'yilaman, himoya mustahkam bo'lsin. Zanjirni eng tepadan quyidagi domengacha bog'layman. Mensiz bolaning da'volari tasdiqsiz chambar bo'lib qolaveradi. Men kimman?"
    s4: "DS yozuvi"
    s5: "DNSKEY yozuvi"
    s6: "NS yozuvi"
  page29:
    title: "DNSSEC Sarguzashti: DS yozuvi tasdiqlandi"
    description: "To'g'ri DS javobingiz .COM serverini hayratda qoldiradi. U dnsimple.com'ning DS va NS yozuvlarini ochib beradi va yangi portalni ochadi."
    s1: "'Aynan,' .COM serveri jilmayadi."
    s2: "DS yozuvi ishonchni ota zonadan bola zonaga bog'laydi."
    s3: "Server dnsimple.com uchun DS va NS yozuvlarini ochib beradi."
    s4: "Yangi portal ochiladi, undan o'ting!"
  page30:
    title: "DNSSEC Sarguzashti: DNSKEY ota va bolani bog'lamaydi"
    description: "DNSKEY taxminingiz noto'g'ri bo'ldi. Tako sizga u domen zonalarini bog'lamasligini eslatadi — bu DS yozuvining vazifasi."
    s1: "'Obbo, bu safar emas,' deydi .COM muloyimlik bilan."
    s2: "DNSKEY yozuvlari imzolarni tasdiqlash uchun ochiq kalitlarni saqlaydi. Ammo ular bola zonani otaga bevosita bog'lamaydi — bu DS yozuvining vazifasi."
    s3: "Ulanish uzildi."
  page31:
    title: "DNSSEC Sarguzashti: NS xavfsizlik yozuvi emas"
    description: "NS yozuvlari shunchaki serverlarga ishora qiladi. Xavfsizlik imzolari yo'qligi sababli, ular jumboqning talabini bajara olmaydi."
    s1: "'Bu xato,' deb qayd etadi .COM."
    s2: "NS yozuvlari avtoritativ serverlarni ko'rsatadi, ammo o'zi xavfsizlik imzolarini taqdim etmaydi."
    s3: "Ulanish uzildi."
  page32:
    title: "DNSSEC Sarguzashti: DNSimple'ning Trusty'siga yetib kelish"
    description: ".COM'dan olingan DS yozuvlaridan kuch olib, siz DNSimple'ning avtoritativ serveriga yo'l olasiz. Trusty DNSSEC bo'yicha qat'iyatingizni sinash uchun kutmoqda."
    s1: ".COM'dan olingan DS yozuvlaridan quvvat olib, siz oldinga xavfsiz yo'lni ishonch bilan belgilayapsiz."
    s2: "Xira nur DNSimple'ning avtoritativ nom serveriga — mehr bilan **Trusty** deb ataladigan serverga yetib kelganingizdan darak beradi."
    s3: "Xona **dnsimple.com** ustidan vakolatni ko'rsatuvchi, sinchkovlik bilan kodlangan naqshlar bilan yaltiraydi."
    s4: "'Sen uzoq yo'l bosib kelding, Rezolver,' deb shivirlaydi yorug' devorlardan taralayotgan do'stona ovoz."
    s5: "Kirish tomon yaqinroq boring"
  page33:
    title: "DNSSEC Sarguzashti: Takoning yana bir sinovi"
    description: "Tako yana bir bor kamdan-kam uchraydigan DNSSEC marosimi haqidagi jumboq bilan paydo bo'ladi. Ildiz ishonchini mustahkamlaydigan marosimni aniqlay olasizmi?"
    s1: "Tako yana paydo bo'ladi, undan sokin hushyorlik taralib turadi."
    s2: "'Trusty bilan uchrashishdan oldin, buni chindan ham o'zlashtirganingga ishonch hosil qilaylik,' deydi Tako hazillashib."
    s3: "Tako sizga navbatdagi **jumboq**ni berarkan, energiya uchqunlanadi:"
    s4: "DNSSEC olamida men kundalik odat emasman, balki kamdan-kam ko'riladigan muqaddas marosimman. Qo'riqchilarim qo'llarida kalitlar bilan yig'ilishadi, butun o'lka bo'ylab ishonchni himoya qilishadi. Mashinalar emas, odamlar hushyor nazorat qiladi, raqamli osmon ostida ishonchni asraydi. Men nimaman?"
    s5: "Zona Imzolash Kaliti (ZSK) almashinuvi"
    s6: "DNSSEC Ildiz Kaliti Imzolash Marosimi"
    s7: "DS Marosimi"
  page34:
    title: "DNSSEC Sarguzashti: ZSK almashinuvi yetarlicha kam emas"
    description: "Tako sizning ZSK almashinuvi taxminingizni rad etadi — u maxsus ildiz darajasidagi marosimdan farqli o'laroq, oddiy va avtomatlashtirilgan."
    s1: "'Yo'q,' Tako muloyimlik bilan tuzatadi."
    s2: "ZSK almashinuvi oddiy va odatda avtomatlashtirilgan, jumboqda ishora qilingan, faqat ildiz kaliti uchun o'tkaziladigan maxsus inson boshchiligidagi marosim emas."
  page35:
    title: "DNSSEC Sarguzashti: Ildiz Kaliti Imzolash Marosimi"
    description: "To'g'ri! Kamdan-kam o'tkaziladigan, inson boshchiligidagi ildiz kaliti imzolash DNSSEC'ning eng yuqori yaxlitligini ta'minlaydi. Tako sizning zukkoligingizdan yayrab kuladi."
    s1: "'Xuddi shunday!' Tako keng jilmayadi."
    s2: "DNSSEC Ildiz Kaliti Imzolash Marosimi — bu ishonchli kalit egalari xavfsiz apparat yordamida ildiz kalitini himoyalash uchun jismonan uchrashadigan kamyob tadbir. U ildiz kalitining yaxlitligi va ishonchliligini ta'minlaydi."
  page36:
    title: "DNSSEC Sarguzashti: DS Marosimi degan narsa yo'q"
    description: "Tako muloyimlik bilan tushuntiradi: DS ota va bola zonalarni bog'laydi, ammo ildiz kaliti imzolashga xos rasmiy marosimga ega emas."
    s1: "'Noto'g'ri,' Tako mehr bilan tushuntiradi."
    s2: "Rasmiy 'DS Marosimi' degan narsa yo'q. DS yozuvlari shunchaki ota va bola zonalarni bog'laydi. **Jumboq** ildiz kaliti darajasidagi noyob, marosimiy jarayonni tasvirlaydi."
  page37:
    title: "DNSSEC Sarguzashti: Trusty xonasiga kirish"
    description: "Qudratli, ammo ishonch bag'ishlovchi DNSimple avtoritativ serveri bilan tanishing. Siz bilan to'liq DNSSEC g'alabasi orasida oxirgi bitta jumboq turibdi."
    s1: "Siz raqamli vakolat bilan g'uvillayotgan Trusty xonasiga kirasiz."
    s2: "Har biri kriptografik himoyalangan, miltillovchi DNS yozuvlari sizni o'rab oladi."
    s3: "Trusty markazda xotirjam turibdi — qudratli, ammo ishonch bag'ishlovchi."
    s4: "'Ozgina qoldi, Rezolver,' deydi Trusty iliqlik bilan. 'Oxirgi bitta savol qoldi.'"
    s5: "Ehtiyotkor qo'llar qulf ostida birlashganda, ildiz farmoni bilan kriptografik dalil yaratilganda, bu eng oliy ishonchdan haqiqiylik erkin oqadi. Kafolatni tasdiqlash uchun nima yuzaga keladi?"
    s6: "Yangi RRSIG yozuvi"
    s7: "Yangi DNSKEY yozuvi"
    s8: "Yangi DS yozuvi"
  page38:
    title: "DNSSEC Sarguzashti: RRSIG yaratilishi tasdiqlandi"
    description: "Siz oxirgi jumboqni uddaladingiz. Yangi RRSIG yozuvlari global tasdiqlash uchun DNSKEY to'plamlarini himoya qiladi — sayohatingiz nihoyasiga yaqinlashmoqda."
    s1: "'Uddaladingiz,' deydi Trusty."
    s2: "Marosim davomida ishonchli shaxslar DNSKEY RRset'ini imzolaydi va yangi RRSIG yozuvini yaratadi. Bu yangi imzo butun dunyodagi rezolverlarga haqiqiylikni tekshirish imkonini beradi."
  page39:
    title: "DNSSEC Sarguzashti: Yolg'iz DNSKEY dalil emas"
    description: "Trusty sizni tuzatadi: DNSKEY kalitni beradi, ammo haqiqiylikni imzo (RRSIG) isbotlaydi."
    s1: "'Unchalik emas,' Trusty muloyimlik bilan tuzatadi."
    s2: "DNSKEY'ning o'zi shunchaki ochiq kalitdir. Marosimda yaratiladigan asosiy narsa — aslida RRSIG, ya'ni DNSKEY to'plamini tasdiqlovchi kriptografik muhrdir."
  page40:
    title: "DNSSEC Sarguzashti: Ildizda DS yozuvi bo'lmaydi"
    description: "DS yozuvi ildizdan yuqorida mavjud bo'la olmaydi. Trusty tushuntiradi: zanjir ildizning imzosida to'xtaydi — undan yuqorida ota zona qolmaydi."
    s1: "'Bu mo'ljaldan chetda,' Trusty sabr bilan tushuntiradi."
    s2: "DS yozuvi bola zonalarni otalarga bog'laydi, ammo ildizning otasi yo'q."
  page41:
    title: "DNSSEC Sarguzashti: Vazifa bajarildi"
    description: "Qahramonona sayohatingiz www.dnsimple.com uchun IP manzil bilan yakunlanadi. Tabriklaymiz, Rezolver — g'alabangizni dunyo bilan bo'lishing!"
    s1: "Uddaladingiz!"
    s2: "Xonaning ma'lumot oqimlari tiniqlashadi va maqsadingizni ko'rsatadi: Mana www.dnsimple.com uchun IP manzil:"
    s3: "**127.0.0.1**"
    s4: "Siz g'olib bo'lib uyga qaytasiz. **Zo'r ish, Rezolver**!"
    s5: "DNSimple jamoasi ushbu kichik sarguzasht sizga yoqqan bo'lishiga umid qiladi. Uni do'stlaringiz bilan bo'lishing, DNSimple taklif qiladigan boshqa imkoniyatlarni ko'rib chiqing va agar biror fikringiz bo'lsa, biz bilan bog'laning!"
  failed:
    s1: "Afsuski, siz vazifangizni bajara olmadingiz :("
    s2: "Rezolveringizning sayohati to'satdan yakunlandi va DNS izlanishi tugallanmay qoldi."
    s3: "Keyingi safar omad tilaymiz!"
    s4: "O'yinni qaytadan boshlash"
